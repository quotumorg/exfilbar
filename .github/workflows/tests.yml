name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
    env:
      HERMES_SOURCE: ${{ github.workspace }}/hermes-src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: exfilbar
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19
          path: hermes-src
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Hermes resolves its core dependencies with uv and its own lock (pillow override); plain pip cannot.
      - run: python -m pip install uv && uv sync --frozen --project hermes-src --python "$(which python)"
      - name: offline tests on Hermes v0.23.0
        working-directory: exfilbar
        # tests run in their own network namespace with loopback only; the runner keeps its network.
        run: sudo unshare --net -- sh -c "ip link set lo up && exec setpriv --reuid=$(id -u) --regid=$(id -g) --init-groups env PATH=$PATH HOME=$HOME HERMES_SOURCE=$HERMES_SOURCE PYTHONDONTWRITEBYTECODE=1 $HERMES_SOURCE/.venv/bin/python -m unittest discover -s tests"
